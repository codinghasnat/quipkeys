<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../style.css"><script src="../lib.js"></script></head><body><div id="stage"></div>
<script>
// 17 — Before telepathy: voice dictation (heads turn), silent speech (mouth
// breathing), telepathy (not yet)... and the keyboard, which is still normal.
const title = el("div", "abs display", null, "Ways to write without typing."); title.style.cssText = "left:120px;top:70px;font-size:88px";
const CW = 390, GAP = 30, X0 = 120, Y0 = 220;
const cards = [0, 1, 2, 3].map((i) => {
  const c = el("div", "sheet abs"); c.style.cssText += `left:${X0 + i * (CW + GAP)}px;top:${Y0}px;width:${CW}px;height:520px;overflow:hidden`;
  return c;
});
const names = ["Voice dictation", "Silent speech", "Telepathy", "The keyboard"];
const notes = ["Fine at home. Everyone hears it at work.", "Mouthing words at your desk. Loudly breathing.", "Not yet.", "Normal. Silent. Everywhere."];
const nm = cards.map((c, i) => { const d = el("div", "abs", c, names[i]); d.style.cssText = "left:28px;top:330px;font:900 40px/1 var(--display);font-variation-settings:'wdth' 112"; return d; });
const nt = cards.map((c, i) => { const d = el("div", "abs", c, notes[i]); d.style.cssText = `left:28px;top:390px;width:${CW - 56}px;font:700 28px/1.25 var(--body);color:var(--ink-soft)`; return d; });
// 1: speech bubble + three heads that turn to look
const bub = el("div", "abs mono", cards[0], "“SO ANYWAY, NEW PARAGRAPH, DEAR KAREN…”"); bub.style.cssText = "left:24px;top:30px;width:340px;padding:14px 16px;background:var(--ink);color:var(--paper);border-radius:14px;font-size:22px;line-height:1.3";
const heads = [0, 1, 2].map((j) => { const h = el("div", "abs", cards[0]); h.style.cssText = `left:${40 + j * 110}px;top:190px;width:84px;height:84px;border-radius:50%;background:#e9d9a2`; h.innerHTML = `<i style="position:absolute;width:12px;height:12px;border-radius:50%;background:#17140a;top:32px;left:22px"></i><i style="position:absolute;width:12px;height:12px;border-radius:50%;background:#17140a;top:32px;left:50px"></i>`; return h; });
// 2: a mouth opening and closing, puffs drifting out
const mouth = el("div", "abs", cards[1]); mouth.style.cssText = "left:135px;top:120px;width:120px;background:#8c2a1e;border-radius:50%;border:8px solid #d97a6c";
const puffs = [0, 1, 2].map(() => { const p = el("div", "abs", cards[1]); p.style.cssText = "width:40px;height:40px;border-radius:50%;background:rgba(160,170,190,.55)"; return p; });
const huff = el("div", "abs mono", cards[1], "hhhff"); huff.style.cssText = "left:250px;top:60px;font-size:30px;color:var(--ink-soft)";
// 3: telepathy, a dashed "?"
const q = el("div", "abs", cards[2], "?"); q.style.cssText = "left:115px;top:60px;width:160px;height:160px;border:6px dashed #b9ab6a;border-radius:50%;display:grid;place-items:center;font:900 100px/1 var(--display);color:#b9ab6a";
// 4: keyboard keycaps
const caps = [..."qwer"].map((c, j) => { const k = el("div", "cap abs", cards[3], c); k.style.cssText += `left:${30 + j * 84}px;top:110px;width:72px;height:72px;font-size:28px`; return k; });
const cap = el("div", "abs", null, "The keyboard isn’t weird. It’s just never been fixed."); cap.style.cssText = "left:120px;top:830px;font:900 58px/1.05 var(--display);font-variation-settings:'wdth' 118;white-space:nowrap";
const strike = cards.slice(0, 3).map(() => { const s = el("div", "abs"); s.style.cssText = "height:8px;background:var(--squiggle);border-radius:4px;transform-origin:left center"; return s; });
window.scene = { duration: 10, render(t) {
  show(title, lerp(t, [0.1, 0.5], [0, 1]));
  cards.forEach((c, i) => { const a = 0.6 + i * 1.3; show(c, lerp(t, [a, a + 0.35], [0, 1])); c.style.transform = `translateY(${lerp(t, [a, a + 0.5], [40, 0])}px) scale(${i === 3 ? lerp(t, [7.0, 7.5], [1, 1.06], ease.spring) : lerp(t, [6.6, 7.0], [1, 0.96])})`; if (i < 3) c.style.filter = `saturate(${lerp(t, [6.6, 7.0], [1, 0.3])})`; c.style.opacity = Math.min(+c.style.opacity, i < 3 ? lerp(t, [6.6, 7.0], [1, 0.55]) : 1); });
  // heads turn toward the speaker on the left
  heads.forEach((h, j) => { const look = lerp(t, [1.4 + j * 0.2, 1.7 + j * 0.2], [0, -10]); h.querySelectorAll("i").forEach((e) => (e.style.marginLeft = look + "px")); h.style.transform = `rotate(${look * 0.8}deg)`; });
  // mouth
  const o = 0.5 + 0.5 * Math.sin(t * 9);
  mouth.style.height = 30 + 70 * o + "px"; mouth.style.top = 150 - 35 * o + "px";
  puffs.forEach((p, j) => { const ph = ((t * 0.9 + j / 3) % 1); place(p, 250 + ph * 110, 150 - ph * 70, `scale(${0.5 + ph})`); show(p, (1 - ph) * (t > 1.9 ? 1 : 0)); });
  caps.forEach((k, j) => press(k, tap(t % 1.2, 0.1 + j * 0.15, 0.2)));
  // cross out the first three
  strike.forEach((s, i) => { s.style.left = X0 + i * (CW + GAP) + 24 + "px"; s.style.top = Y0 + 352 + "px"; s.style.width = (CW - 48) * lerp(t, [6.0 + i * 0.15, 6.4 + i * 0.15], [0, 1]) + "px"; });
  show(cap, lerp(t, [7.4, 7.8], [0, 1])); place(cap, 0, lerp(t, [7.4, 7.9], [24, 0]));
}};
</script></body></html>
