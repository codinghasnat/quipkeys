<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../style.css"><script src="../lib.js"></script></head><body><div id="stage"></div>
<script>
// 18 — Spell by sound (the opt-in mode for people who spell by ear, e.g. with
// dyslexia). Real engine output with the mode on, replayed word by word,
// against Hunspell's first suggestion per word (real output too).
const tag = el("div", "tag abs", null, "Spell by sound · free, switch it on in the menu"); tag.style.fontSize = "30px"; place(tag, 160, 60);
const sheet = el("div", "sheet abs"); sheet.style.cssText += "left:160px;top:140px;width:1600px;height:620px;";
const L = [
  { typed: "can you sea the oshun", check: ["can", "you", "sea", "the", "shun"], steps: ["can", "can you", "can you see", "can you see the", "can you see the ocean"] },
  { typed: "it was a nise restorant", check: ["it", "was", "a", "niche", "restoration"], steps: ["it", "it was", "it was a", "it was a nise", "it was a nice restaurant"] },
  { typed: "i need sum noledge", check: ["I", "need", "sum", "no ledge"], steps: ["I", "I need", "I need some", "I need some knowledge"] },
];
const rows = L.map((_, i) => {
  const q = el("div", "abs mono", sheet); q.style.cssText = `left:56px;top:${44 + i * 195}px;font-size:64px;white-space:pre`;
  const c = el("div", "abs mono", sheet); c.style.cssText = `left:60px;top:${128 + i * 195}px;font-size:32px;white-space:pre;color:var(--ink-soft)`;
  return { q, c };
});
const cap = el("div", "abs", null, "Spell it how it sounds. QuipKeys finds the word."); cap.style.cssText = "left:160px;top:800px;font:900 56px/1.05 var(--display);font-variation-settings:'wdth' 118;white-space:nowrap";
const foot = el("div", "abs foot", null, "Grey: Hunspell’s first suggestion for each word. Both real output. In tests Spell by sound fixed about 3 in 4 sound spellings in real sentences, and misses some."); foot.style.cssText = "left:160px;top:890px;font-size:26px;width:1600px";
const CPS = 15, starts = [0.4, 3.0, 5.6];
window.scene = { duration: 10.5, render(t) {
  L.forEach((s, i) => {
    const toks = s.typed.split(" ");
    const d = decodeLine(toks, s.steps, t, starts[i], CPS);
    rows[i].q.innerHTML = d.html;
    rows[i].c.innerHTML = d.done ? "spellcheck: " + checkerLine(toks, s.check, d.done) : "";
  });
  show(cap, lerp(t, [8.0, 8.4], [0, 1])); place(cap, 0, lerp(t, [8.0, 8.5], [24, 0]));
  show(foot, lerp(t, [8.5, 8.9], [0, 1]));
}};
</script></body></html>
