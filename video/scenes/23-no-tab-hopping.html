<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../style.css"><script src="../lib.js"></script></head><body><div id="stage"></div>
<script>
// 23 — No tab-hopping: the usual copy-into-a-chatbot routine vs one hotkey.
const L = ["Copy the email", "Open an AI chat tab", "Paste it in", "Type what you want", "Wait", "Copy the answer", "Switch back and paste"];
const R = ["Copy the email", "Type what you want", "Press Ctrl+Alt+W"];
const col = (x, head, items, colour) => {
  const box = el("div", "sheet abs"); box.style.cssText += `left:${x}px;top:70px;width:810px;height:720px;padding:30px 36px`;
  const h = el("div", "", box, head); h.style.cssText = `font:900 46px/1 var(--display);font-variation-settings:'wdth' 112;margin-bottom:24px;color:${colour}`;
  const rows = items.map((s, i) => { const r = el("div", "", box); r.style.cssText = "display:flex;align-items:center;gap:16px;font:700 31px/1.2 var(--body);margin:0 0 16px";
    r.innerHTML = `<span style="width:48px;height:48px;border-radius:50%;background:${colour};color:#fff;display:grid;place-items:center;font:900 26px/1 var(--display)">${i + 1}</span><span>${s}</span>`; return r; });
  const sum = el("div", "", box); sum.style.cssText = `position:absolute;left:36px;bottom:30px;font:900 40px/1 var(--display);font-variation-settings:'wdth' 112;color:${colour}`;
  return { rows, sum };
};
const A = col(120, "The usual way", L, "#8a7a3c"), B = col(990, "With QuipKeys", R, "var(--fix)");
const cap = el("div", "abs", null, "No tab-hopping. It writes where you are."); cap.style.cssText = "left:120px;top:850px;font:900 62px/1.05 var(--display);font-variation-settings:'wdth' 118;white-space:nowrap";
const cap2 = el("div", "abs", null, "No copying answers back. No switching windows."); cap2.style.cssText = "left:120px;top:945px;font:700 34px/1 var(--body);color:var(--ink-soft);white-space:nowrap";
window.scene = { duration: 10, render(t) {
  A.rows.forEach((r, i) => { const a = 0.4 + i * 0.55; show(r, lerp(t, [a, a + 0.25], [0, 1])); });
  B.rows.forEach((r, i) => { const a = 0.4 + i * 0.55; show(r, lerp(t, [a, a + 0.25], [0, 1])); });
  A.sum.textContent = "7 steps · 2 window switches"; show(A.sum, lerp(t, [4.5, 4.9], [0, 1]));
  B.sum.textContent = "3 steps · 0 switches"; show(B.sum, lerp(t, [4.7, 5.1], [0, 1]));
  show(cap, lerp(t, [5.9, 6.3], [0, 1])); place(cap, 0, lerp(t, [5.9, 6.4], [24, 0]));
  show(cap2, lerp(t, [6.4, 6.8], [0, 1]));
}};
</script></body></html>
