<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../style.css"><script src="../lib.js"></script></head><body><div id="stage"></div>
<script>
// 16 — Pay, then click: a generic subscription grammar checker (illustration,
// no real brand) wants a click per fix and locks some behind an upgrade.
// QuipKeys fixes the same text as it's typed, with no clicks.
const TEXT = [["Thanks for ", null], ["teh", "the"], [" update. I'll ", null], ["recieve", "receive"], [" the files ", null], ["tomorow", "tomorrow"], [" and send them ", null], ["befor", "before"], [" lunch.", null]];
const LOCKED = 2; // the third typo is "premium only"
function mkSheet(x, title) {
  const s = el("div", "sheet abs"); s.style.cssText += `left:${x}px;top:220px;width:820px;height:360px;`;
  const h = el("div", "abs", s, title); h.style.cssText = "left:0;top:0;width:820px;padding:20px 34px;font:700 28px/1 var(--body);color:var(--ink-soft);border-bottom:2px solid rgba(23,20,10,.08)";
  const b = el("div", "abs mono", s); b.style.cssText = "left:34px;top:100px;width:752px;font-size:42px;line-height:1.55";
  return { s, b };
}
const L = mkSheet(120, "Subscription grammar checker <span style='font-weight:400'>(illustration)</span>");
const R = mkSheet(980, "QuipKeys");
const lc = el("div", "abs display"); lc.style.cssText = "left:120px;top:610px;font-size:60px";
const rc = el("div", "abs display"); rc.style.cssText = "left:980px;top:610px;font-size:60px;color:var(--fix)";
const card = el("div", "abs"); card.style.cssText = "background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 18px 40px -10px rgba(23,20,10,.45);font:700 30px/1.2 var(--body);white-space:nowrap";
const cursor = el("div", "abs"); cursor.innerHTML = `<svg width="38" height="50" viewBox="0 0 19 25"><path d="M1 1l0 20 5-5 4 8 3-1.5-4-8 7 0z" fill="#17140a" stroke="#fff" stroke-width="1.6"/></svg>`;
const cap = el("div", "abs", null, "Pay every month. Then click every fix yourself."); cap.style.cssText = "left:120px;top:790px;font:900 60px/1.05 var(--display);font-variation-settings:'wdth' 118;white-space:nowrap";
const cap2 = el("div", "abs", null, "QuipKeys fixes it as you type. Zero clicks. Free."); cap2.style.cssText = "left:120px;top:880px;font:700 40px/1 var(--body);color:var(--fix);white-space:nowrap";
const T0 = 1.3, STEP = 1.35;
window.scene = { duration: 9.5, render(t) {
  // left: everything is there, typos underlined; fixes happen as you click
  let k = 0, clicks = 0, h = "";
  TEXT.forEach(([s, fix]) => {
    if (!fix) { h += esc(s); return; }
    const i = k++, at = T0 + i * STEP + 0.85;
    if (i !== LOCKED && t >= at) { h += `<span>${fix}</span>`; clicks++; }
    else h += `<span class="typo" data-i="${i}">${s}</span>`;
  });
  L.b.innerHTML = h;
  // cursor + suggestion card for the current typo
  const i = Math.floor((t - T0) / STEP);
  if (i >= 0 && i < 4) {
    const span = L.b.querySelector(`[data-i="${i}"]`) || L.b.querySelectorAll("span")[i];
    const r = span.getBoundingClientRect();
    const local = (t - T0) - i * STEP;
    const tx = r.left + r.width / 2, ty = r.bottom + 10;
    const prev = [tx - 160, ty + 120];
    place(cursor, lerp(local, [0, 0.4], [prev[0], tx]), lerp(local, [0, 0.4], [prev[1], ty + 70]), `scale(${local > 0.8 && local < 0.95 ? 0.85 : 1})`);
    show(cursor, 1);
    const fix = TEXT.filter((x) => x[1])[i];
    card.innerHTML = i === LOCKED ? `<span style="color:#7a5d00">Premium only</span><br><span style="font-weight:400;font-size:26px">Upgrade to fix this one</span>` : `${fix[0]} → <b style="color:var(--fix)">${fix[1]}</b> &nbsp;<span style="background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:8px;font-size:24px">Accept</span>`;
    place(card, tx - 20, ty - 4 - 0); card.style.marginTop = "0px";
    show(card, local > 0.3 && local < 1.2 ? 1 : 0);
  } else { show(cursor, 0); show(card, 0); }
  lc.textContent = `Clicks: ${clicks}`;
  // right: typed live, each typo fixed at its space
  const full = TEXT.map((x) => x[0]).join("");
  const n = Math.max(0, Math.min(full.length, Math.floor((t - 0.4) * 22)));
  let pos = 0, rh = "";
  TEXT.forEach(([s, fix], j) => {
    const vis = Math.max(0, Math.min(s.length, n - pos));
    if (fix && n > pos + s.length) rh += `<span class="fix">${fix}</span>`;
    else rh += esc(s.slice(0, vis));
    pos += s.length;
  });
  R.b.innerHTML = rh;
  rc.textContent = "Clicks: 0";
  show(cap, lerp(t, [6.9, 7.3], [0, 1])); place(cap, 0, lerp(t, [6.9, 7.4], [24, 0]));
  show(cap2, lerp(t, [7.4, 7.8], [0, 1]));
}};
</script></body></html>
