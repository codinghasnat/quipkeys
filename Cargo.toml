[package]
name = "quipkeys"
version = "0.1.0"
edition = "2021"
description = "Offline probabilistic typing decoder: types what you meant, not what you hit."
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "qk"
path = "src/bin/qk.rs"

[[bin]]
name = "qk-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "qk-ngrams"
path = "src/bin/ngrams.rs"

[[bin]]
name = "qk-tokenize"
path = "src/bin/tokenize.rs"

[profile.release]
debug = 1
