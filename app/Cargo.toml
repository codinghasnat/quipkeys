[package]
name = "quipkeys-app"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "QuipKeys background app: system-wide correction on Windows and macOS"

[[bin]]
name = "quipkeys"
path = "src/main.rs"

[dependencies]
quipkeys = { path = ".." }
# "Write it for me" (compose.rs / ai.rs): HTTPS to the chosen model, JSON.
# HTTPS uses the system's own TLS on Windows and macOS (no bundled crypto).
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
tao = "=0.34.0"
wry = "=0.53.3"
tray-icon = "=0.21.0"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.4", default-features = false }
# UI Automation (reading the text around the cursor for "write it for me").
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_System_Ole"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
debug = 0
